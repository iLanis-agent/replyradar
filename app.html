<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReplyRadar - Track RSVPs</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0d0a14; color:#ece8f6; min-height:100vh; }
  .wrap { max-width:940px; margin:0 auto; padding:36px 20px 80px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
  .logo { font-weight:800; font-size:20px; }
  .logo span { color:#c4b5fd; }
  .home { color:#9c92b8; text-decoration:none; font-size:14px; }
  .home:hover { color:#fff; }
  .panel { background:#161226; border:1px solid #2b2245; border-radius:16px; padding:22px; margin-bottom:22px; }
  .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; }
  label { display:block; font-size:12.5px; font-weight:600; color:#9c92b8; margin-bottom:6px; text-transform:uppercase; letter-spacing:.05em; }
  input, textarea { width:100%; background:#0d0a14; border:1px solid #332a52; border-radius:10px; color:#ece8f6; padding:11px 12px; font-size:15px; outline:none; font-family:inherit; }
  input:focus, textarea:focus { border-color:#8b5cf6; }
  textarea { min-height:110px; resize:vertical; }
  button.go { margin-top:16px; width:100%; background:linear-gradient(90deg,#8b5cf6,#d946ef); border:0; color:#fff; font-size:16px; font-weight:700; padding:14px; border-radius:12px; cursor:pointer; }
  .stat-row { display:flex; flex-wrap:wrap; gap:26px; align-items:baseline; }
  .big { font-size:clamp(40px,6vw,56px); font-weight:800; letter-spacing:-.02em; background:linear-gradient(90deg,#c4b5fd,#f0abfc); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .stat-label { color:#9c92b8; font-size:13.5px; }
  .stat-num { font-size:24px; font-weight:700; color:#fff; }
  .bar { height:8px; background:#241c3d; border-radius:999px; margin-top:16px; overflow:hidden; }
  .bar > div { height:100%; background:linear-gradient(90deg,#8b5cf6,#d946ef); border-radius:999px; transition:width .3s; }
  .band { margin-top:10px; font-size:14.5px; color:#c9bfe4; }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:#655b80; padding:10px 8px; border-bottom:1px solid #2b2245; }
  td { padding:9px 8px; font-size:14.5px; border-bottom:1px solid #1e1832; color:#d8d0ea; vertical-align:middle; }
  .seg { display:inline-flex; background:#0d0a14; border:1px solid #332a52; border-radius:999px; overflow:hidden; }
  .seg button { border:0; background:transparent; color:#9c92b8; font-size:12px; font-weight:700; padding:5px 10px; cursor:pointer; }
  .seg button.on-yes { background:rgba(74,222,128,.18); color:#4ade80; }
  .seg button.on-maybe { background:rgba(251,191,36,.18); color:#fbbf24; }
  .seg button.on-no { background:rgba(248,113,113,.15); color:#f87171; }
  .po { width:52px; text-align:center; padding:6px 4px; font-size:13px; }
  .chase { font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .chase.gentle { background:rgba(96,165,250,.15); color:#93c5fd; }
  .chase.deadline { background:rgba(251,191,36,.15); color:#fcd34d; }
  .chase.final { background:rgba(248,113,113,.18); color:#fca5a5; }
  .chase.late { background:rgba(248,113,113,.28); color:#fecaca; }
  .chase.ok { background:rgba(148,163,184,.10); color:#7d7494; }
  .copy { border:1px solid #332a52; background:transparent; color:#c4b5fd; font-size:12px; font-weight:600; padding:5px 10px; border-radius:8px; cursor:pointer; }
  .copy:hover { border-color:#8b5cf6; }
  .empty { text-align:center; color:#655b80; padding:36px 0; font-size:15px; }
  .remove { background:none; border:0; color:#655b80; cursor:pointer; font-size:15px; }
  .remove:hover { color:#f87171; }
  .hint { margin-top:8px; font-size:12.5px; color:#655b80; }
  .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#8b5cf6; color:#fff; font-size:14px; font-weight:600; padding:10px 20px; border-radius:999px; opacity:0; transition:opacity .25s; pointer-events:none; }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">Reply<span>Radar</span></div><a class="home" href="index.html">&#8592; Home</a></header>

  <div class="panel">
    <div class="form-grid">
      <div><label for="evName">Event name</label><input id="evName" placeholder="Rooftop BBQ"></div>
      <div><label for="evDate">Event date</label><input id="evDate" type="date"></div>
      <div><label for="rsvpBy">RSVP by</label><input id="rsvpBy" type="date"></div>
    </div>
    <div style="margin-top:14px">
      <label for="guestText">Guest list (one per line, or comma-separated)</label>
      <textarea id="guestText" placeholder="Ada Lovelace&#10;Alan Turing&#10;Grace Hopper"></textarea>
      <div class="hint">Adding names here and pressing "Update list" adds new guests without losing replies you've already tracked.</div>
    </div>
    <button class="go" id="update">Update list</button>
  </div>

  <div id="summary"></div>
  <div id="list"></div>
</div>
<div class="toast" id="toast"></div>
<script src="engine.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var LS = 'replyradar-state';
  var state = { evName: '', evDate: '', rsvpBy: '', guests: [] };

  function parseLocal(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

  function save() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(LS) || 'null');
      if (s && s.guests) state = s;
    } catch (e) {}
  }

  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.style.opacity = '1';
    setTimeout(function () { t.style.opacity = '0'; }, 1600);
  }

  function mergeList() {
    var names = ReplyEngine.parseGuestList($('guestText').value);
    var have = {};
    state.guests.forEach(function (g) { have[g.name.toLowerCase()] = true; });
    var added = 0;
    names.forEach(function (n, i) {
      if (!have[n.toLowerCase()]) {
        var g = ReplyEngine.makeGuest(n, Date.now() % 100000 + i);
        g.invitedDaysAgo = 6; // assume invites went out a bit ago
        state.guests.push(g); added++;
      }
    });
    state.evName = $('evName').value.trim();
    state.evDate = $('evDate').value;
    state.rsvpBy = $('rsvpBy').value;
    save(); render();
    if (added) toast(added + ' guest' + (added === 1 ? '' : 's') + ' added');
  }

  function daysOut(dateStr) {
    if (!dateStr) return 999;
    return ReplyEngine.daysBetween(new Date(), parseLocal(dateStr));
  }

  function renderSummary() {
    var box = $('summary');
    if (!state.guests.length) { box.innerHTML = ''; return; }
    var s = ReplyEngine.stats(state.guests);
    var band = ReplyEngine.headcountBand(state.guests);
    var evDays = daysOut(state.evDate);
    box.innerHTML = '<div class="panel"><div class="stat-row">'
      + '<div><div class="big">' + s.responseRate + '%</div><div class="stat-label">response rate (' + s.replied + ' of ' + s.total + ')</div></div>'
      + '<div><div class="stat-num">' + s.confirmed + '</div><div class="stat-label">confirmed heads</div></div>'
      + '<div><div class="stat-num">' + s.pending + '</div><div class="stat-label">still silent</div></div>'
      + '<div><div class="stat-num">' + band.low + ' - ' + band.high + '</div><div class="stat-label">headcount band</div></div>'
      + (evDays !== 999 ? '<div><div class="stat-num">' + evDays + '</div><div class="stat-label">days to event</div></div>' : '')
      + '</div><div class="bar"><div style="width:' + s.responseRate + '%"></div></div>'
      + '<div class="band">Plan food for about <b>' + Math.round((band.low + band.high) / 2) + '</b> - between ' + band.low + ' confirmed and ' + band.high + ' if the maybes and stragglers show.</div></div>';
  }

  function renderList() {
    var box = $('list');
    if (!state.guests.length) { box.innerHTML = '<div class="panel empty">Paste your guest list above to start tracking.</div>'; return; }
    var evDays = daysOut(state.evDate);
    var rDays = daysOut(state.rsvpBy);
    var rows = state.guests.map(function (g, i) {
      var stage = ReplyEngine.chaseStage(g, rDays, evDays);
      var seg = '<div class="seg">'
        + '<button data-i="' + i + '" data-s="yes" class="' + (g.status === 'yes' ? 'on-yes' : '') + '">Yes</button>'
        + '<button data-i="' + i + '" data-s="maybe" class="' + (g.status === 'maybe' ? 'on-maybe' : '') + '">Maybe</button>'
        + '<button data-i="' + i + '" data-s="no" class="' + (g.status === 'no' ? 'on-no' : '') + '">No</button></div>';
      var chase = stage === 'ok'
        ? '<span class="chase ok">' + (g.status === 'pending' ? 'No chase yet' : 'Replied') + '</span>'
        : '<span class="chase ' + stage + '">' + ReplyEngine.CHASE_LABELS[stage] + '</span> <button class="copy" data-i="' + i + '">Copy message</button>';
      var po = g.status === 'pending' ? '-' : '<input class="po" type="number" min="0" max="5" value="' + (g.plusOnes || 0) + '" data-i="' + i + '" title="Plus-ones">';
      return '<tr><td><b>' + esc(g.name) + '</b></td><td>' + seg + '</td><td>' + po + '</td><td>' + chase + '</td>'
        + '<td><button class="remove" data-i="' + i + '" title="Remove guest">&#10005;</button></td></tr>';
    });
    box.innerHTML = '<div class="panel"><table><thead><tr><th>Guest</th><th>Reply</th><th>+1s</th><th>Chase</th><th></th></tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
  }

  function render() { renderSummary(); renderList(); }

  $('update').addEventListener('click', mergeList);
  ['evName','evDate','rsvpBy'].forEach(function (id) {
    $(id).addEventListener('input', function () {
      state.evName = $('evName').value.trim(); state.evDate = $('evDate').value; state.rsvpBy = $('rsvpBy').value;
      save(); renderSummary(); renderList();
    });
  });

  $('list').addEventListener('click', function (e) {
    var el = e.target;
    var i = el.getAttribute('data-i');
    if (i === null) return;
    i = +i;
    if (el.classList.contains('copy')) {
      var g = state.guests[i];
      var stage = ReplyEngine.chaseStage(g, daysOut(state.rsvpBy), daysOut(state.evDate));
      var msg = ReplyEngine.chaseMessage(g, state.evName, stage, daysOut(state.rsvpBy));
      var done = function () { toast('Chase message copied'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(msg).then(done, done);
      else done();
      return;
    }
    if (el.classList.contains('remove')) {
      state.guests.splice(i, 1); save(); render(); return;
    }
    if (el.tagName === 'BUTTON' && el.getAttribute('data-s')) {
      var g2 = state.guests[i];
      var ns = el.getAttribute('data-s');
      g2.status = (g2.status === ns) ? 'pending' : ns;
      save(); render();
    }
  });

  $('list').addEventListener('input', function (e) {
    var el = e.target;
    if (el.classList.contains('po')) {
      var i = +el.getAttribute('data-i');
      state.guests[i].plusOnes = Math.max(0, Math.min(5, parseInt(el.value, 10) || 0));
      save(); renderSummary();
    }
  });

  load();
  $('evName').value = state.evName || '';
  $('evDate').value = state.evDate || '';
  $('rsvpBy').value = state.rsvpBy || '';
  render();
})();
</script>
</body>
</html>
